<body class="intro">
  <div class="stage" aria-hidden="true">
    <img class="wave wave-a" src="assets/wave-a.svg" alt="">
    <img class="wave wave-b" src="assets/wave-b.svg" alt="">
    <p class="stage-tag"><span class="t1">Swap,</span><br><span class="t2">Trade In,</span><br><span class="t3">Upgrade.</span></p>
    <img class="stage-arrows" src="assets/arrows.svg" alt="">
  </div>
  <a class="stage-logo" href="./" data-home aria-label="SwapDesk home"><img src="assets/swapdesk-logo.png" alt="swapdesk" width="744" height="203"></a>

  <main class="popup" id="popup" aria-live="polite">
    <div class="popup-head" aria-hidden="true"><span class="grab"></span></div>
    <div class="popup-body" id="body" tabindex="-1">
      <div class="screen welcome"><h1 class="h-display welcome-t" id="welcome">Welcome to<br><span class="blue">SwapDesk</span></h1></div>
    </div>
  </main>

  <button class="me-chip oq-chip" id="oqchip" type="button" hidden>Open Quote</button>
  <button class="me-chip" id="mechip" type="button" aria-expanded="false" hidden></button>
  <div class="me-menu" id="memenu" role="menu" aria-label="Account" hidden></div>
  <script>
    // Signed-in customers are welcomed back by name while prices load.
    try { var m = JSON.parse(localStorage.getItem('swapdesk.me.v1') || 'null'); if (m && m.name) { var w = document.getElementById('welcome'); w.innerHTML = 'Welcome back,<br><span class="blue"></span>'; w.lastChild.textContent = String(m.name).trim().split(/\s+/)[0]; } } catch (e) {}
  </script>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="position:fixed;inset:auto 0 0;padding:20px;background:#fff;text-align:center">SwapDesk needs JavaScript to show prices. Message us on WhatsApp on 0703 785 3959.</p></noscript>
</body>
